[package]
name = "ages"
description = "Ages Persistent World"
version = "0.0.1"
url = ""
author = "ricktastrophe"
author = "jamesfelicia <notanonlinepredator@gmail.com>"

  [package.sources]
  include = "src/**/*.{nss,json}"

  [package.rules]
  "*" = "src/$ext"

[target]
name = "ages"
file = "ages.mod"
description = "Ages Persistent World Module"
flags = "--max-include-depth=30"
	[target.sources]
	exclude = "src/tlk/*"

[target]
name = "2das"
group = "haks"
description = "A hak file with all the ages persistent world 2das."
file = "${NWN_HOME}/hak/ages_2das.hak"
	[target.sources]
	include = "src/2das/*.2da"
	
[target]
name = "models"
group = "haks"
description = "A hak file with all the ages persistent world model and texture data."
file = "${NWN_HOME}/hak/ages_models.hak"
	[target.sources]
	include = "src/**/*.{mdl,tga,plt}"

[target]
name = "tlk"
group = "haks"
description = "Custom talk file for ages"
file = "${NWN_HOME}/tlk/ages.tlk"
  [target.sources]
  include = "src/tlk/*.json"